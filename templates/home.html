<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Recognition Dashboard | Smart Sign Learning</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        /* Background Video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(26,42,108,0.88), rgba(0,0,0,0.92));
            z-index: -1;
        }

        body {
            min-height: 100vh;
            color: #ffffff;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
        }

        header h1 {
            font-size: 2.4rem;
        }

        .back-button {
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid #00f5d4;
            color: #00f5d4;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #00f5d4;
            color: #000;
        }

        /* Dashboard */
        .dashboard {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        /* Buttons */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 35px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f5d4, #90dbf4);
            color: #000;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn.danger {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        /* Detection Panel */
        .detection {
            margin-top: 30px;
        }

        .detection h2 {
            margin-bottom: 15px;
            color: #ffd166;
        }

        .text-box {
            width: 100%;
            min-height: 120px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            font-size: 1.2rem;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="static/bg.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Header -->
    <header>
        <h1>Sign Recognition Dashboard</h1>
        <a href="{{ url_for('index') }}" class="back-button"><i class="fas fa-home"></i> Home</a>
    </header>

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="controls">
            <a href="{{ url_for('generate_frames') }}" class="btn"><i class="fas fa-camera"></i> Open Camera</a>
            <a href="{{ url_for('play_voice', lang='english') }}" class="btn"><i class="fas fa-volume-up"></i> English</a>
            <a href="{{ url_for('play_voice', lang='tamil') }}" class="btn"><i class="fas fa-volume-up"></i> Tamil</a>
            <a href="{{ url_for('play_voice', lang='hindi') }}" class="btn"><i class="fas fa-volume-up"></i> Hindi</a>
            <a href="{{ url_for('play_voice', lang='malayalam') }}" class="btn"><i class="fas fa-volume-up"></i> Malayalam</a>
            <a href="{{ url_for('play_voice', lang='kannada') }}" class="btn"><i class="fas fa-volume-up"></i> Kannada</a>
            <a href="{{ url_for('delete') }}" class="btn danger"><i class="fas fa-trash"></i> Clear</a>
        </div>

        <div class="detection">
            <h2>Detected Letters & Words</h2>
            <div class="text-box" id="whole_word_text"></div>
        </div>

    </div>

    <script>
        function getData() {
            fetch('/get_data')
                .then(response => response.json())
                .then(data => {
                    if (!data.error) {
                        document.getElementById('whole_word_text').textContent = data.data;
                    }
                })
                .catch(error => console.error(error));
        }

        window.onload = getData;
        setInterval(getData, 1000);
    </script>

</body>
</html>
