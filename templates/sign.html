<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Learning Platform | Smart Sign Learning</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        /* Background Video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(26,42,108,0.85), rgba(0,0,0,0.9));
            z-index: -1;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
        }

        .back-btn button {
            background: transparent;
            border: 2px solid #00f5d4;
            color: #00f5d4;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn button:hover {
            background: #00f5d4;
            color: #000;
        }

        /* Main Card */
        .platform {
            width: 90%;
            max-width: 700px;
            padding: 50px 45px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1rem;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 35px;
            background: linear-gradient(135deg, #00f5d4, #90dbf4);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #000;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }

        .btn.secondary {
            background: transparent;
            border: 2px solid #00f5d4;
            color: #00f5d4;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        /* Loading */
        #loadingMessage {
            display: none;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffd166;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .platform {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="static/bg.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Back Button -->
    <div class="back-btn">
        <a href="/index"><button>Back</button></a>
    </div>

    <!-- Platform -->
    <div class="platform">
        <h1>Sign Learning Platform</h1>
        <p>Convert text and speech into sign-based learning using interactive video modules.</p>

        <form action="/video_feed_endpoint" method="post">
            <label for="text">Enter Text to Learn Signs</label>
            <input type="text" id="text" name="text" placeholder="Type a word or sentence" required>
            <button type="submit" class="btn">Convert to Sign</button>
        </form>

        <a href="/speak">
            <button class="btn secondary" onclick="startSpeech()">Speech Input</button>
        </a>

        <div id="loadingMessage">🎙️ Listening... Speak now</div>
    </div>

    <script>
        function startSpeech() {
            const loadingMessage = document.getElementById('loadingMessage');
            loadingMessage.style.display = 'block';
            setTimeout(() => {
                loadingMessage.style.display = 'none';
            }, 5000);
        }
    </script>

</body>
</html>
